name: Build FROST XTREME APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Project
        run: flutter analyze
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release -v

      - name: Prepare APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/FROST-XTREME.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FROST-XTREME-APK
          path: release/FROST-XTREME.apk
          retention-days: 30

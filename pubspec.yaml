name: frost_xtreme
description: FROST XTREME - Industrial Cooling Control System
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_blue_plus: ^1.31.11
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  rive: ^0.13.1
  fl_chart: ^0.68.0
  syncfusion_flutter_gauges: ^25.2.3
  pdf: ^3.10.7
  excel: ^4.0.6
  permission_handler: ^11.3.0
  connectivity_plus: ^5.0.2
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  flutter_local_notifications: ^17.1.2
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  animated_text_kit: ^4.2.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter_native_splash:
  color: "#0A0A1A"
  image: assets/splash.png
  android: true
  ios: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/rive/
    - assets/fonts/
  fonts:
    - family: Orbitron
      fonts:
        - asset: assets/fonts/Orbitron-Black.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Bold.ttf
